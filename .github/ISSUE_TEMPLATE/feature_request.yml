name: Feature request
description: Describe a problem and the outcome you need
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the behavior and any compatibility or security implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
