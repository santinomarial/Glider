syntax = "proto3";

package glider.v1;

import "google/protobuf/struct.proto";

// ControlPlane is deliberately small in Phase 11. Struct payloads carry the
// versioned JSON resource model while the model is still evolving; the RPC
// package and apiVersion field are stable compatibility boundaries.
service ControlPlane {
  rpc PutTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc PutNode(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListTasks(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListNodes(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DrainNode(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListAssignments(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc PutWorkload(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteWorkload(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListWorkloads(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc PutService(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteService(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListServices(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc PutSecret(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListSecrets(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteSecret(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetAssignmentSecrets(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc PutEvent(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListEvents(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Schedule(google.protobuf.Struct) returns (google.protobuf.Struct);
}
