syntax = "proto3";

package glider.v1;

import "google/protobuf/struct.proto";

// ControlPlane is deliberately small in Phase 11. Struct payloads carry the
// versioned JSON resource model while the model is still evolving; the RPC
// package and apiVersion field are stable compatibility boundaries.
service ControlPlane {
  rpc PutTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc PutNode(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetTask(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListNodes(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListAssignments(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Schedule(google.protobuf.Struct) returns (google.protobuf.Struct);
}
